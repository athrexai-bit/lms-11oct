<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="refresh" content="0;url=http://127.0.0.1:8080/index.html?course=3"/>
  <title>Redirecting…</title>
  <script>
    const host = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? location.hostname : '127.0.0.1';
    location.replace(`${location.protocol}//${host}:8080/index.html?course=3`);
  </script>
</head>
<body>
  <p>This program now lives on the main site. <a href="http://127.0.0.1:8080/index.html?course=3">Open Enterprise AI Architect</a>.</p>
</body>
</html>
