services:
  - type: web
    name: arthrex-lms-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd api && gunicorn -w 4 -b 0.0.0.0:$PORT index:app --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: PORT
        value: "10000"

  - type: static_site
    name: arthrex-lms-frontend
    staticPublishPath: .
    buildCommand: echo "Static files ready"
    routes:
      - path: /*
        destination: /index.html
